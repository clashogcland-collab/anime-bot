version: "3.9"

services:
  telegram-bot-api:
    image: gramiojs/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    ports:
      - "8081:8081"
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    depends_on:
      - telegram-bot-api
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    env_file: .env
    depends_on:
      - telegram-bot-api
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  bot_api_data:
